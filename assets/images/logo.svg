<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2f7c"/>
      <stop offset="100%" stop-color="#1a1c4d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0281f"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0281f"/>
      <stop offset="100%" stop-color="#8f1512"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- red swoosh arc -->
  <path d="M 95 105 C 300 40, 560 40, 630 145"
        fill="none" stroke="url(#swoosh)" stroke-width="12" stroke-linecap="round"/>

  <!-- star icon -->
  <g filter="url(#softShadow)" transform="translate(60,95)">
    <path d="M40 0 L49 27 L78 27 L54 44 L63 71 L40 54 L17 71 L26 44 L2 27 L31 27 Z"
          fill="url(#redGrad)"/>
  </g>

  <!-- wordmark: MAGIC TOOLS -->
  <text x="115" y="205" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="bold" font-size="108" fill="url(#navyGrad)" filter="url(#softShadow)"
        letter-spacing="1">MAGIC TOOLS</text>

  <!-- wordmark: CONTRACTING -->
  <text x="118" y="278" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="bold" font-size="62" fill="url(#redGrad)" filter="url(#softShadow)"
        letter-spacing="2">CONTRACTING</text>

  <!-- divider line -->
  <line x1="20" y1="320" x2="1080" y2="320" stroke="#d8d8d8" stroke-width="2"/>

  <!-- services list -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="40"
     fill="url(#redGrad)" text-anchor="middle">
    <text x="550" y="385">General Contracting  •  Renovations</text>
    <text x="550" y="440">Additions  •  Design &amp; Build</text>
    <text x="550" y="495">Kitchens  •  Baths  •  Full Remodels</text>
  </g>
</svg>
